[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "generalization"
version = "0.1.0"
description = "Controlled Fashion-MNIST regularization ablations"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
generalization = "generalization.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
